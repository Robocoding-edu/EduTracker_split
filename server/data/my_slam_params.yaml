slam_toolbox:
  ros__parameters:
    # Базовые фреймы
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_sim_time: false

    # Увеличенный буфер для лучшей корреляции сканов
    scan_buffer_size: 20
    transform_publish_period: 0.05

    # Размер стека для публикации карты
    stack_size_to_use: 80000000

    # Точное отслеживание движения
    minimum_travel_distance: 0.03   # Обновлять при малейшем смещении
    minimum_travel_heading: 0.03   # Чувствительность к поворотам
    map_update_interval: 0.5        # Обновление карты каждые 0.5 сек

    # Scan Matcher - максимальная точность
    use_scan_matching: true
    scan_match_space_dim: 2
    minimum_time_interval: 0.1

    # Параметры для высокой точности (требует больше CPU)
    throttle_scans: 1               # Обрабатывать ВСЕ сканы (макс. точность)
    resolution: 0.05                # Пиксель 5 см (высокое разрешение)
    max_laser_range: 12.0           # Максимальная дальность лазера
    max_num_nodes: 2000             # Больше узлов для точной карты

    # Параметры оптимизации графа
    use_loop_closure: true
    loop_closure_threshold: 0.4
    loop_closure_maximum_distance: 5.0
    loop_closure_maximum_angle: 0.5
    loop_closure_maximum_variance_ratio: 1.5
    search_space_dimension: 2
    search_grid_resolution: 0.1
    search_grid_size: 0.3
    search_grid_variance: 0.01
    search_grid_iterations: 10
    search_grid_explore_multifacility: false
    outlier_max_rejection_distance: 1.0
    outlier_ignored_outlier_count: 3
    tf_buffer_duration: 10.0
