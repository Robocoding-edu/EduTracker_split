slam_toolbox:
  ros__parameters:

    ###########################################################
    # БАЗОВЫЕ НАСТРОЙКИ
    ###########################################################

    # Имя глобальной карты
    map_frame: map

    # Фрейм одометрии
    odom_frame: odom

    # Центр робота
    base_frame: base_link

    # Топик лидара
    scan_topic: /scan

    # Режим работы:
    # mapping - строить карту
    # localization - локализация по готовой карте
    mode: mapping

    # Использовать время симулятора Gazebo
    use_sim_time: false


    ###########################################################
    # БУФЕРЫ И TF
    ###########################################################

    # Сколько последних сканов хранить в памяти.
    # Больше = лучше сопоставление, больше RAM.
    scan_buffer_size: 30

    # Частота публикации transform map->odom.
    #
    # 0.05 = 20 Гц
    # 0.1  = 10 Гц
    #
    # Обычно 0.05 вполне нормально.
    transform_publish_period: 0.05

    # Размер стека потока.
    # Обычно не трогают.
    stack_size_to_use: 80000000

    # Сколько секунд хранить TF историю.
    #
    # Если видишь ошибки:
    # "Lookup would require extrapolation"
    # можно увеличить.
    tf_buffer_duration: 10.0


    ###########################################################
    # КОГДА ОБНОВЛЯТЬ КАРТУ
    ###########################################################

    # Минимальное перемещение робота,
    # после которого запускается обработка.
    #
    # Меньше:
    # + точнее
    # - больше нагрузка
    minimum_travel_distance: 0.03

    # Минимальный угол поворота (рад)
    #
    # 0.03 рад ≈ 1.7°
    minimum_travel_heading: 0.03

    # Как часто публиковать карту.
    #
    # 0.5 = 2 раза в секунду
    # 1.0 = раз в секунду
    map_update_interval: 0.2

    # Минимальный интервал между обработкой сканов.
    #
    # Для лидара 10 Гц:
    # 0.05 безопасно
    # 0.1 уже на грани
    minimum_time_interval: 0.05


    ###########################################################
    # SCAN MATCHING
    ###########################################################

    # Использовать сопоставление сканов.
    #
    # ОБЯЗАТЕЛЬНО true
    # Иначе точность сильно падает.
    use_scan_matching: true

    # Размерность пространства.
    #
    # Для мобильного робота всегда 2.
    scan_match_space_dim: 2

    # Пропуск сканов.
    #
    # 1 = использовать все
    # 2 = каждый второй
    # 3 = каждый третий
    #
    # На Raspberry лучше оставить 1,
    # если CPU справляется.
    throttle_scans: 1


    ###########################################################
    # КАРТА
    ###########################################################

    # Размер одной клетки карты.
    #
    # 0.10 = 10 см
    # 0.05 = 5 см
    # 0.03 = 3 см
    # 0.02 = 2 см
    #
    # Меньше = карта красивее,
    # но требований к качеству одометрии больше.
    resolution: 0.03

    # Максимальная дальность лидара.
    #
    # Всё дальше этого расстояния
    # будет отброшено.
    max_laser_range: 12.0

    # Максимальное количество узлов графа.
    #
    # Больше:
    # + большие карты
    # - больше RAM
    max_num_nodes: 2000


    ###########################################################
    # LOOP CLOSURE
    ###########################################################

    # Обнаружение уже посещённых мест.
    #
    # Если робот объехал квартиру кругом,
    # карта сможет "стянуться" и исправиться.
    #
    # Обычно включают.
    use_loop_closure: false

    # Порог уверенности для loop closure.
    #
    # Ниже = больше ложных совпадений.
    # Выше = сложнее найти совпадение.
    loop_closure_threshold: 0.5

    # Максимальная дистанция поиска совпадения.
    #
    # Если робот дальше чем на 5 м,
    # loop closure искать не будет.
    loop_closure_maximum_distance: 5.0

    # Максимальная разница углов.
    #
    # 0.5 рад ≈ 28°
    loop_closure_maximum_angle: 0.5

    # Допуск по дисперсии.
    #
    # Обычно не трогают.
    loop_closure_maximum_variance_ratio: 1.0


    ###########################################################
    # ПОИСК СОВПАДЕНИЙ СКАНОВ
    ###########################################################

    # Размерность поиска.
    search_space_dimension: 2

    # Шаг сетки поиска.
    #
    # Меньше:
    # + точнее
    # - медленнее
    search_grid_resolution: 0.1

    # Размер области поиска (метры).
    #
    # Чем больше,
    # тем сильнее отклонения может исправить.
    search_grid_size: 0.3

    # Ожидаемый шум.
    #
    # Обычно не трогают.
    search_grid_variance: 0.01

    # Сколько итераций оптимизации делать.
    #
    # Больше:
    # + точнее
    # - медленнее
    search_grid_iterations: 10

    # Экспериментальная функция.
    #
    # Обычно false.
    search_grid_explore_multifacility: false


    ###########################################################
    # ФИЛЬТРАЦИЯ МУСОРА
    ###########################################################

    # Максимальное отклонение точки,
    # после которого она считается выбросом.
    outlier_max_rejection_distance: 1.0

    # Сколько выбросов подряд можно игнорировать.
    outlier_ignored_outlier_count: 3
