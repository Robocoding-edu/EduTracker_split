controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    enable_stamped_cmd_vel: false
    cmd_vel_topic: /cmd_vel

    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      required_movement_angle: 0.05
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      stateful: false

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Линейные скорости (м/с) - строго 35-350 мм/с
      desired_linear_vel: 0.25          # Максимальная скорость: 250 мм/с (снижено для стабильности)
      min_approach_linear_velocity: 0.035  # Минимальная скорость приближения: 35 мм/с
      regulated_linear_scaling_min_speed: 0.035  # Минимальная регулируемая скорость: 35 мм/с

      # Лимиты ускорения (м/с²) - плавные для синхронизации с SLAM
      max_linear_accel: 0.15             # Максимальное линейное ускорение (снижено для плавности)
      min_linear_accel: -0.15            # Минимальное линейное ускорение (торможение)

      # Параметры lookahead
      lookahead_dist: 0.50
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.70

      lookahead_time: 1.5
      transform_tolerance: 0.8

      use_velocity_scaled_lookahead_dist: true

      approach_velocity_scaling_dist: 0.50

      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 2.0

      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false

      regulated_linear_scaling_min_radius: 0.90

      use_rotate_to_heading: false

      max_angular_accel: 0.5
      rotate_to_heading_angular_vel: 0.4

      goal_dist_tol: 0.15

planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: true
      allow_unknown: true

local_costmap:
  ros__parameters:
    use_sim_time: false

    update_frequency: 5.0
    publish_frequency: 5.0

    width: 4
    height: 4
    resolution: 0.03

    robot_base_frame: base_link

    footprint: "[[-0.09, -0.14], [-0.09, 0.14], [0.09, 0.14], [0.09, -0.14]]"

    footprint_padding: 0.01

    global_frame: odom

    rolling_window: true

    plugins:
      - obstacle_layer
      - inflation_layer

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"

      enabled: true

      observation_sources: scan

      scan:
        topic: /scan
        max_obstacle_height: 2.0

        clearing: true
        marking: true

        data_type: LaserScan

        inf_is_valid: false

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"

      inflation_radius: 0.20
      cost_scaling_factor: 5.0

global_costmap:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link

    footprint: "[[-0.09, -0.14], [-0.09, 0.14], [0.09, 0.14], [0.09, -0.14]]"

    footprint_padding: 0.01

    resolution: 0.03

    update_frequency: 2.0
    publish_frequency: 1.0

    plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"

      enabled: true

      map_subscribe_transient_local: true

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"

      enabled: true

      observation_sources: scan

      scan:
        topic: /scan

        max_obstacle_height: 2.0

        clearing: true
        marking: true

        data_type: LaserScan

        inf_is_valid: false

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"

      inflation_radius: 0.18

      cost_scaling_factor: 7.0

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map

    robot_base_frame: base_link

    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

    bt_loop_duration: 10

    default_server_timeout: 30

    enable_groot_monitoring: false

behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw

    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

    global_frame: odom

    robot_base_frame: base_link

    transform_tolerance: 0.2
