controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    enable_stamped_cmd_vel: false
    cmd_vel_topic: /cmd_vel

    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.1
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.6

      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6

      lookahead_time: 1.5
      transform_tolerance: 0.1

      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.7

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false

      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.25

      use_rotate_to_heading: true

      max_angular_accel: 1.5
      rotate_to_heading_angular_vel: 0.5

      goal_dist_tol: 0.20

planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

local_costmap:
  ros__parameters:
    use_sim_time: false

    update_frequency: 5.0
    publish_frequency: 5.0

    width: 4
    height: 4
    resolution: 0.03

    robot_base_frame: base_link

    footprint: "[[-0.09, -0.14], [-0.09, 0.14], [0.09, 0.14], [0.09, -0.14]]"

    footprint_padding: 0.01

    global_frame: odom

    rolling_window: true

    plugins:
      - obstacle_layer
      - inflation_layer

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"

      enabled: true

      observation_sources: scan

      scan:
        topic: /scan
        max_obstacle_height: 2.0

        clearing: true
        marking: true

        data_type: LaserScan

        inf_is_valid: false

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"

      inflation_radius: 0.25
      cost_scaling_factor: 8.0

global_costmap:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link

    footprint: "[[-0.09, -0.14], [-0.09, 0.14], [0.09, 0.14], [0.09, -0.14]]"

    footprint_padding: 0.01

    resolution: 0.03

    update_frequency: 2.0
    publish_frequency: 1.0

    plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"

      enabled: false

      map_subscribe_transient_local: true

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"

      enabled: true

      observation_sources: scan

      scan:
        topic: /scan

        max_obstacle_height: 2.0

        clearing: true
        marking: true

        data_type: LaserScan

        inf_is_valid: false

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"

      inflation_radius: 0.20

      cost_scaling_factor: 5.0

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map

    robot_base_frame: base_link

    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

    bt_loop_duration: 10

    default_server_timeout: 30

    enable_groot_monitoring: false

behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw

    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

    global_frame: odom

    robot_base_frame: base_link

    transform_tolerance: 0.2
